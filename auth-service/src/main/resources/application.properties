spring.application.name=auth-service
server.port=${PORT:8081}

# Datasource: base de datos propia del servicio (auth_db)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/auth_db}
spring.datasource.username=${DB_USER:veterinaria}
spring.datasource.password=${DB_PASSWORD:veterinaria}

# JPA: the schema is owned by Flyway migrations, never by Hibernate auto-ddl
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# CORS: origin(s) allowed to call this API (comma-separated)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:3000}

# Rutas públicas de este servicio (se suman a swagger y health, definidas en common)
app.security.rutas-publicas=/api/v1/auth/register,/api/v1/auth/login,/api/v1/auth/logout,/.well-known/jwks.json

# JWT: llaves PEM compartidas por todas las réplicas (vacío = par en memoria, solo una réplica)
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
app.jwt.private-key-location=${JWT_PRIVATE_KEY_LOCATION:}
app.jwt.public-key-location=${JWT_PUBLIC_KEY_LOCATION:}

# Cookie de sesión (HttpOnly) donde viaja el JWT. En producción con frontend y API en dominios distintos:
# SESION_COOKIE_SECURE=true y SESION_COOKIE_SAMESITE=None (exige HTTPS).
app.sesion.cookie.nombre=${SESION_COOKIE_NOMBRE:veterinaria_sesion}
app.sesion.cookie.secure=${SESION_COOKIE_SECURE:false}
app.sesion.cookie.same-site=${SESION_COOKIE_SAMESITE:Strict}

app.openapi.descripcion=Registro, login, emisión de JWT (JWKS) y perfil de usuario.

management.endpoint.health.probes.enabled=true
