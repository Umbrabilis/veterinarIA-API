spring.application.name=pacientes-service
server.port=${PORT:8082}

# Datasource: base de datos propia del servicio (pacientes_db)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pacientes_db}
spring.datasource.username=${DB_USER:veterinaria}
spring.datasource.password=${DB_PASSWORD:veterinaria}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:3000}

# Cookie HttpOnly con el JWT (la emite auth-service); debe llamarse igual en todos los servicios
app.sesion.cookie.nombre=${SESION_COOKIE_NOMBRE:veterinaria_sesion}

# Valida los JWT con la llave pública que publica auth-service
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
# Con jwk-set-uri, issuer-uri no hace discovery: solo agrega la validación del claim iss.
spring.security.oauth2.resourceserver.jwt.issuer-uri=veterinaria-api

app.openapi.descripcion=Propietarios (con consentimiento de tratamiento de datos) y mascotas.

management.endpoint.health.probes.enabled=true
