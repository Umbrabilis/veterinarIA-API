spring.application.name=historias-service
server.port=${PORT:8084}

# Datasource: base de datos propia del servicio (historias_db)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/historias_db}
spring.datasource.username=${DB_USER:veterinaria}
spring.datasource.password=${DB_PASSWORD:veterinaria}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:3000}

# Cookie HttpOnly con el JWT (la emite auth-service); debe llamarse igual en todos los servicios
app.sesion.cookie.nombre=${SESION_COOKIE_NOMBRE:veterinaria_sesion}

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
# Con jwk-set-uri, issuer-uri no hace discovery: solo agrega la validación del claim iss.
spring.security.oauth2.resourceserver.jwt.issuer-uri=veterinaria-api

# Servicios que consulta (el JWT del usuario se reenvía en cada llamada)
app.servicios.pacientes-url=${PACIENTES_SERVICE_URL:http://localhost:8082}

# Resúmenes IA. Sin API key se usa la plantilla local (el flujo de aprobación es el mismo).
# El prompt solo recibe datos clínicos y de la mascota, nunca datos del propietario.
app.ia.anthropic.api-key=${ANTHROPIC_API_KEY:}
app.ia.anthropic.modelo=${ANTHROPIC_MODEL:claude-opus-5-5}

# Correo para enviar resúmenes aprobados (en docker-compose: Mailpit)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
app.correo.remitente=${MAIL_FROM:no-responder@veterinaria.local}

# Zona horaria de la clínica para "hoy" en el seguimiento
app.zona-horaria=America/Bogota

app.openapi.descripcion=Historia clínica inmutable (consultas, enmiendas, vacunas), seguimiento y resúmenes IA.

management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false
