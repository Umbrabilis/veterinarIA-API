spring.application.name=historias-service
server.port=${PORT:8084}

# Datasource: base de datos propia del servicio (historias_db)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/historias_db}
spring.datasource.username=${DB_USER:veterinaria}
spring.datasource.password=${DB_PASSWORD:veterinaria}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_JWKS_URI:http://localhost:8081/.well-known/jwks.json}

# Servicios que consulta (el JWT del usuario se reenvía en cada llamada)
app.servicios.pacientes-url=${PACIENTES_SERVICE_URL:http://localhost:8082}

# Zona horaria de la clínica para "hoy" en el seguimiento
app.zona-horaria=America/Bogota

app.openapi.descripcion=Historia clínica inmutable (consultas, enmiendas, vacunas), seguimiento y resúmenes IA.

management.endpoint.health.probes.enabled=true
