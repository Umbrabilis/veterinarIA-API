spring.application.name=graphql-gateway
server.port=${PORT:8086}

# GraphQL bajo /api para que el navegador envíe la cookie de sesión (Path=/api)
spring.graphql.http.path=/api/v1/graphql
spring.graphql.graphiql.enabled=${GRAPHIQL_ENABLED:true}
spring.graphql.graphiql.path=/graphiql

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:3000}

# Cookie HttpOnly con el JWT (la emite auth-service); debe llamarse igual en todos los servicios
app.sesion.cookie.nombre=${SESION_COOKIE_NOMBRE:veterinaria_sesion}

# La página de GraphiQL es estática; las consultas que hace sí exigen sesión.
app.security.rutas-publicas=/graphiql,/graphiql/**

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
spring.security.oauth2.resourceserver.jwt.issuer-uri=veterinaria-api

# Servicios que consulta (el JWT del usuario se reenvía en cada llamada)
app.servicios.auth-url=${AUTH_SERVICE_URL:http://localhost:8081}
app.servicios.pacientes-url=${PACIENTES_SERVICE_URL:http://localhost:8082}
app.servicios.citas-url=${CITAS_SERVICE_URL:http://localhost:8083}
app.servicios.historias-url=${HISTORIAS_SERVICE_URL:http://localhost:8084}

app.openapi.descripcion=Gateway GraphQL de solo lectura sobre los microservicios.

management.endpoint.health.probes.enabled=true
