# API Gateway: único punto de entrada para el frontend (http://localhost:8080).
# Enruta por prefijo de ruta a cada microservicio y reparte la carga entre sus réplicas.
# Se resuelve el DNS de Docker en cada petición (resolver + variable): si se agregan o quitan
# réplicas con `docker compose up --scale`, el gateway las usa sin reiniciarse.

server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 2m;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 150s; # generar un resumen con IA puede tardar

    set $auth      http://auth-service:8080;
    set $pacientes http://pacientes-service:8080;
    set $citas     http://citas-service:8080;
    set $historias http://historias-service:8080;

    # auth-service
    location /api/v1/auth/     { proxy_pass $auth; }
    location /api/v1/usuarios  { proxy_pass $auth; }

    # pacientes-service
    location /api/v1/propietarios { proxy_pass $pacientes; }
    location /api/v1/mascotas     { proxy_pass $pacientes; }

    # citas-service
    location /api/v1/citas { proxy_pass $citas; }

    # historias-service (historia clínica, vacunas, seguimiento y resúmenes IA)
    location /api/v1/consultas   { proxy_pass $historias; }
    location /api/v1/vacunas     { proxy_pass $historias; }
    location /api/v1/seguimiento { proxy_pass $historias; }
    location /api/v1/resumenes   { proxy_pass $historias; }

    # Contratos OpenAPI de cada servicio (los agrupa la Swagger UI en /docs/)
    location = /v3/api-docs/auth-service      { proxy_pass $auth/v3/api-docs; }
    location = /v3/api-docs/pacientes-service { proxy_pass $pacientes/v3/api-docs; }
    location = /v3/api-docs/citas-service     { proxy_pass $citas/v3/api-docs; }
    location = /v3/api-docs/historias-service { proxy_pass $historias/v3/api-docs; }

    set $docs      http://swagger-ui:8080;
    location /docs/ { proxy_pass $docs; }

    location = /health {
        default_type application/json;
        return 200 '{"status":"UP"}';
    }

    location / {
        default_type application/json;
        return 404 '{"status":404,"error":"Not Found","message":"Ruta no encontrada en el gateway"}';
    }
}
