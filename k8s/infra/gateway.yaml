# Gateway Nginx: única entrada pública (puertos 80 y 443). Enruta la API REST, GraphQL, el WebSocket de
# notificaciones y el frontend. k3s expone el Service LoadBalancer en esos puertos del nodo.
# HTTPS: el certificado de Let's Encrypt vive en el nodo (/etc/letsencrypt, lo renueva certbot) y se monta aquí;
# el ConfigMap gateway-https solo existe si hay certificado (ver gateway/nginx.conf).
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  type: LoadBalancer
  selector:
    app: gateway
  ports:
    - name: http
      port: 80
      targetPort: 80
    - name: https
      port: 443
      targetPort: 443
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
            - containerPort: 443
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 80
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d
            - name: https
              mountPath: /etc/nginx/https
            - name: certificados
              mountPath: /etc/letsencrypt
              readOnly: true
            - name: acme
              mountPath: /var/www/acme
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: gateway-nginx
        - name: https
          configMap:
            name: gateway-https
            optional: true
        - name: certificados
          hostPath:
            path: /etc/letsencrypt
            type: DirectoryOrCreate
        - name: acme
          hostPath:
            path: /var/lib/veterinaria/acme
            type: DirectoryOrCreate
