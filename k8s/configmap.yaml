# Configuración común a los microservicios (lo secreto va en el Secret veterinaria-secretos).
apiVersion: v1
kind: ConfigMap
metadata:
  name: veterinaria-config
data:
  PORT: "8080"
  AUTH_JWKS_URI: http://auth-service:8080/.well-known/jwks.json
  AUTH_SERVICE_URL: http://auth-service:8080
  PACIENTES_SERVICE_URL: http://pacientes-service:8080
  CITAS_SERVICE_URL: http://citas-service:8080
  HISTORIAS_SERVICE_URL: http://historias-service:8080
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  DB_POOL_MAX: "5"
  # El frontend se sirve por el mismo gateway (mismo origen): CORS solo hace falta para desarrollo local.
  CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
  # Por HTTP plano la cookie no puede ser Secure. Si el servidor obtiene certificado, instalar-servidor.sh lo
  # cambia a "true" antes de aplicar los manifiestos.
  SESION_COOKIE_SECURE: "false"
  # Nginx termina el HTTPS y llama a los servicios por HTTP: con X-Forwarded-Proto los servicios saben que el
  # navegador usó https (lo necesita, por ejemplo, la comprobación de mismo origen del WebSocket).
  SERVER_FORWARD_HEADERS_STRATEGY: native
  SESION_COOKIE_SAMESITE: Strict
  # Memoria de la JVM ajustada al límite del contenedor; SerialGC usa menos memoria en nodos pequeños.
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70 -XX:+UseSerialGC -XX:TieredStopAtLevel=1"
