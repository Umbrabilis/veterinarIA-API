# auth-service: Deployment + Service + HPA (autoescalado horizontal por CPU).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  labels:
    app: auth-service
    parte-de: veterinaria
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
        parte-de: veterinaria
    spec:
      # Sin variables automáticas de los Services (p. ej. REDIS_PORT=tcp://...), que pisan nuestra configuración.
      enableServiceLinks: false
      containers:
        - name: auth-service
          image: veterinaria/auth-service:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: veterinaria-config
          env:
            - name: DB_URL
              value: jdbc:postgresql://postgres:5432/auth_db
            - name: DB_USER
              value: veterinaria_app
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: veterinaria-secretos
                  key: APP_DB_PASSWORD
            - name: SPRING_FLYWAY_USER
              value: veterinaria
            - name: SPRING_FLYWAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: veterinaria-secretos
                  key: POSTGRES_PASSWORD
            - name: JWT_PRIVATE_KEY_LOCATION
              value: file:/llaves/private.pem
            - name: JWT_PUBLIC_KEY_LOCATION
              value: file:/llaves/public.pem
          resources:
            requests:
              cpu: 100m
              memory: 320Mi
            limits:
              cpu: "1"
              memory: 640Mi
          # Arranque lento en un nodo pequeño: hasta 5 minutos antes de declararlo fallido.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: llaves-jwt
              mountPath: /llaves
              readOnly: true
      volumes:
        - name: llaves-jwt
          secret:
            secretName: veterinaria-jwt
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  labels:
    app: auth-service
spec:
  selector:
    app: auth-service
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# Escala entre 1 y 3 réplicas según el uso de CPU (requiere metrics-server, incluido en k3s).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: auth-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: auth-service
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
