# Servidor HTTPS del gateway. No lo aplica kustomize: k8s/aws/instalar-servidor.sh lo carga en el ConfigMap
# gateway-https solo cuando certbot obtuvo el certificado (guardado en el nodo, en /etc/letsencrypt).
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/veterinaria/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/veterinaria/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:5m;

    include /etc/nginx/conf.d/rutas.inc;
}
