# Gateway en Kubernetes: misma tabla de rutas que docker/gateway/nginx.conf (está en rutas.inc). Aquí cada nombre
# (auth-service, ...) es un Service de Kubernetes con IP fija; kube-proxy reparte las peticiones entre las réplicas
# que crea el HPA. El frontend se sirve por este mismo gateway, así que el navegador ve un solo origen.
#
# HTTPS: si el servidor tiene certificado, k8s/aws/instalar-servidor.sh crea el ConfigMap gateway-https con
# servidor.conf (el server del puerto 443) y activar.inc (activa la redirección de HTTP a HTTPS). Sin ese ConfigMap
# los dos include de /etc/nginx/https no encuentran archivos y todo sigue por HTTP.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Lo que sigue respondiendo por HTTP aunque haya HTTPS: el reto de Let's Encrypt y el chequeo de salud.
map $uri $queda_en_http {
    ~^/\.well-known/acme-challenge/ 1;
    /health                         1;
    default                         0;
}

include /etc/nginx/https/*.conf;

server {
    listen 80;
    server_name _;

    set $https_activo 0;
    set $dominio_https "";
    include /etc/nginx/https/*.inc;
    set $redirigir "${https_activo}${queda_en_http}";
    if ($redirigir = "10") {
        return 301 https://$dominio_https$request_uri;
    }

    # Reto HTTP-01 de Let's Encrypt (certbot escribe aquí al emitir y renovar el certificado)
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    include /etc/nginx/conf.d/rutas.inc;
}
