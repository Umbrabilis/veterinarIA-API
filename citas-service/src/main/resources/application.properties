spring.application.name=citas-service
server.port=${PORT:8083}

# Datasource: base de datos propia del servicio (citas_db)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/citas_db}
spring.datasource.username=${DB_USER:veterinaria}
spring.datasource.password=${DB_PASSWORD:veterinaria}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_JWKS_URI:http://localhost:8081/.well-known/jwks.json}

# Servicios que consulta (el JWT del usuario se reenvía en cada llamada)
app.servicios.auth-url=${AUTH_SERVICE_URL:http://localhost:8081}
app.servicios.pacientes-url=${PACIENTES_SERVICE_URL:http://localhost:8082}

app.openapi.descripcion=Agenda de citas: agendar, reprogramar, cancelar y cambiar estado.

management.endpoint.health.probes.enabled=true
