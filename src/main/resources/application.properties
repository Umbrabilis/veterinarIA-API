spring.application.name=veterinaria-api

# Datasource (matches docker-compose.yml by default; override with env vars in other environments)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/veterinaria}
spring.datasource.username=${DB_USER:veterinaria}
spring.datasource.password=${DB_PASSWORD:veterinaria}

# JPA: the schema is owned by Flyway migrations, never by Hibernate auto-ddl
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# CORS: origin(s) allowed to call this API (comma-separated)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# JWT
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
